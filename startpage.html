<!DOCTYPE html>
<!-- This part of the HTML file defines the basic functionality and structure
of the file, including scale and styling. I suggest not modifying
the structure unless you know what you're doing.-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New tab</title>
  <link rel="icon" type="image/svg+xml" href="svg/topbar.svg">
  <link rel="stylesheet" href="startpage.css">
</head>
<body>

  <!-- HERO SECTION (Top Main Screen) -->
  <main class="hero-container">
  <!-- This is the main section of the startpage, where the weather, clock, search bar, 
  and quicklinks are located. Again, I recommend not modifying the structure unless 
  you know what you're doing. This doesn't apply to the quicklinks, which need modifying
  to be replaced. A tutorial on how to modify them is provided below. -->

    <!-- WEATHER -->
    <div id="weather">
      <button id="weather-settings-btn" title="Change Location" aria-label="Change Location">
        <img src="svg/gear.svg" alt="" class="weather-gear-icon" draggable="false">
      </button>
      <div id="weather-temp">--°C</div>
      <div id="weather-highlow">H: --° L: --°</div>
      <div id="weather-desc">Loading weather...</div>
    </div>

    <!-- CLOCK -->
    <div id="clock-block">
      <div id="timer-mirror">00:00:00</div>
      <div id="clock">--:--</div>
      <div id="date">Loading date...</div>
    </div>

    <!-- SEARCH -->
    <form id="search-form" action="https://www.google.com/search" method="GET" target="_self">
      <div id="search-wrapper">
        <img id="search-icon" src="svg/google.svg" alt="Google" draggable="false">
        <input type="text" name="q" id="search" placeholder="Search Google..." autofocus autocomplete="off">
      </div>
    </form>

    <!-- QUICKLINKS -->
    <!-- Here you can change the five quicklinks present below the search bar.
    Simply change the <href> attribute of each link to whatever link you want it to
    point to instead. Make sure the title and label attributes are updated accordingly. 
    You can also replace the icons with your own by swapping the SVG files. I don't recommend
    modifying the number of links present to not mess up the layout. -->
    <div id="links">
      <a class="quicklink" href="https://www.youtube.com" title="YouTube" draggable="false">
        <div class="icon-square"><img src="svg/youtube.svg" alt="YouTube" draggable="false"></div>
        <span class="label">YouTube</span>
      </a>
      <a class="quicklink" href="https://gemini.google.com" title="Google Gemini" draggable="false">
        <div class="icon-square"><img src="svg/gemini.svg" alt="Gemini" draggable="false"></div>
        <span class="label">Gemini</span>
      </a>
      <a class="quicklink" href="https://mail.google.com" title="Gmail" draggable="false">
        <div class="icon-square"><img src="svg/gmail.svg" alt="Gmail" draggable="false"></div>
        <span class="label">Gmail</span>
      </a>
      <a class="quicklink" href="https://www.wikipedia.org" title="Wikipedia" draggable="false">
        <div class="icon-square"><img src="svg/wikipedia.svg" alt="Wikipedia" draggable="false"></div>
        <span class="label">Wikipedia</span>
      </a>
      <a class="quicklink" href="https://www.reddit.com" title="Reddit" draggable="false">
        <div class="icon-square"><img src="svg/reddit.svg" alt="Reddit" draggable="false"></div>
        <span class="label">Reddit</span>
      </a>
    </div>

  </main>

  <!-- TIMER PANEL & INTEGRATED TOGGLE -->
  <div id="timer-panel">
    <button id="timer-toggle" class="tab-toggle-btn" title="Toggle timer" aria-label="Toggle timer">&#8250;</button>
    <span class="tab-label">
      <img src="svg/timer.svg" alt="Timer" class="tab-label-icon" draggable="false">
    </span>

    <div class="timer-inner">
      <div id="timer-display">00:00:00</div>
      <div class="timer-controls">
        <div class="timer-btn-row">
          <button class="timer-btn" id="timer-start">Start</button>
          <button class="timer-btn" id="timer-pause">Pause</button>
        </div>
        <div class="timer-btn-row">
          <button class="timer-btn" id="timer-reset">Reset</button>
          <button class="timer-btn" id="timer-pip" title="Picture-in-Picture">PiP</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOCATION SETTINGS MODAL -->
  <div id="location-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Enter new coordinates (Latitude, Longitude):</h3>
      <input type="text" id="modal-coords-input" placeholder="e.g. 48.8566, 2.3522" autocomplete="off">
      <div class="modal-actions">
        <button id="modal-save-btn" class="modal-btn save">OK</button>
        <button id="modal-cancel-btn" class="modal-btn cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timer.js"></script>
  <!-- SCRIPTS -->
  <!-- These are calls for the four main JavaScript files that handle
  the core functionality of the page (clock, weather, UI, timer). Do not modify
  this stack in any way shape or form, otherwise elements of the page will NOT function
  correctly or outright stop working.-->

  <!-- NOTE: The scripts are loaded in the order they are listed. Changing the order 
   may cause issues with the functionality of the page. -->

</body>
</html>
